    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: var(--page);
    }

    body {
      font-family: 'FreeSans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
      overflow: hidden;
      color: var(--ink);
    }

    :focus-visible {
      outline: 2px solid #2b6cb0;
      outline-offset: 2px;
    }

    /* Base desktop layout */
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .photo {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 57.1038%;
      overflow: hidden;
    }

    .photo-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 100% 50%;
      display: block;
      -webkit-user-drag: none;
      user-select: none;
    }

    .photo-img--tall {
      display: block;
    }

    .photo-img--wide {
      display: none;
    }

    .scrim {
      display: none;
    }

    .hero {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 836px;
      height: 949px;
      transform-origin: left bottom;
      pointer-events: none;
    }

    .hero > * {
      pointer-events: auto;
    }

    .badge {
      position: absolute;
      left: var(--badge-left);
      top: var(--badge-top);
      display: inline-flex;
      align-items: center;
      gap: var(--badge-gap);
      height: 37px;
      padding: 0 16px 0 19px;
      border-radius: 999px;
      background: var(--badge-bg);
      backdrop-filter: blur(7px) saturate(120%);
      -webkit-backdrop-filter: blur(7px) saturate(120%);
      box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 6px 18px rgba(0,0,0,.14);
      color: #fff;
      font-size: var(--badge-fs);
      font-weight: var(--badge-fw);
      letter-spacing: var(--badge-ls);
      word-spacing: var(--badge-ws);
      white-space: nowrap;
    }

    .badge-icon {
      width: 17px;
      height: 16.27px;
      position: relative;
      top: -1px;
      flex-shrink: 0;
    }

    .hl-wrap {
      position: static;
    }

    .hl {
      position: absolute;
      font-family: 'Eloquia', sans-serif;
      font-variation-settings: 'wght' var(--hl-wght);
      line-height: var(--hl-lh);
      color: var(--ink);
      white-space: nowrap;
    }

    #hl1 {
      left: var(--hl1-left);
      top: var(--hl1-top);
      font-size: var(--hl1-fs);
      letter-spacing: var(--hl1-ls);
      word-spacing: var(--hl1-ws);
    }

    #hl2 {
      left: var(--hl2-left);
      top: var(--hl2-top);
      font-size: var(--hl2-fs);
      letter-spacing: var(--hl2-ls);
    }

    .pane {
      position: absolute;
      left: 57.1038%;
      right: 0;
      top: 0;
      bottom: 0;
    }

    .card {
      position: absolute;
      left: 1px;
      top: 14px;
      width: 613px;
      height: 922px;
      border-radius: 26px;
      overflow: hidden;
      background: rgba(254, 254, 254, 0.90);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid rgba(0, 0, 0, 0.036);
      box-shadow: var(--card-shadow);
    }

    .card-in {
      position: absolute;
      left: 0;
      top: 0;
      width: 613px;
      height: 922px;
      transform-origin: left top;
    }

    .col {
      position: absolute;
      left: 62px;
      width: 488px;
    }

    .center {
      text-align: center;
    }

    #h1 {
      top: var(--h1-top);
      font-family: 'Eloquia', sans-serif;
      font-variation-settings: 'wght' var(--h1-wght);
      font-size: var(--h1-fs);
      letter-spacing: var(--h1-ls);
      word-spacing: var(--h1-ws);
      color: var(--h1-color);
      line-height: 1.15;
    }

    #sub {
      top: var(--sub-top);
      font-size: var(--sub-fs);
      letter-spacing: var(--sub-ls);
      word-spacing: var(--sub-ws);
      font-weight: var(--sub-fw);
      color: var(--sub-grey);
      line-height: 1.35;
    }

    #sub b {
      font-weight: var(--sub-fwb);
      color: var(--ink);
    }

    .field {
      position: absolute;
      left: 62px;
      width: 489px;
      display: flex;
      align-items: center;
      border-radius: 12px;
    }

    #email {
      top: 203px;
      height: 61px;
      background: var(--inputFill);
      border: 1.5px solid var(--inputBorder);
      padding: 0 var(--fieldpad);
    }

    #pw {
      top: 273.5px;
      height: 59px;
      background: var(--pwFill);
      border: 0;
      padding: 0 var(--fieldpad);
    }

    .field input {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      outline: none;
      font-family: inherit;
      color: var(--ink);
    }

    #email input {
      font-size: var(--eph-fs);
      letter-spacing: var(--eph-ls);
      word-spacing: var(--eph-ws);
      font-weight: var(--eph-fw);
    }

    #pw input {
      font-size: var(--pph-fs);
      letter-spacing: var(--pph-ls);
      font-weight: var(--pph-fw);
    }

    .field input::placeholder {
      color: var(--ph);
      opacity: 1;
    }

    #loginBtn {
      position: absolute;
      left: 62px;
      top: 366px;
      width: 489px;
      height: 65.5px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--btn1) 0%, var(--btn2) 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--login-gap);
      padding-left: var(--login-padl);
      padding-right: 4px;
      box-shadow: 0 8px 20px rgba(18, 26, 34, 0.16), 0 2px 5px rgba(18, 26, 34, 0.10);
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: var(--login-fs);
      font-weight: var(--login-fw);
      letter-spacing: var(--login-ls);
      transition: transform 0.18s cubic-bezier(0.2, 0.7, 0.3, 1), box-shadow 0.18s ease, filter 0.18s ease;
    }

    #loginBtn:hover {
      filter: brightness(1.12);
    }

    #loginBtn:active {
      transform: translateY(1px);
    }

    .arrow-svg {
      width: var(--arrow-w);
      height: var(--arrow-w);
      flex-shrink: 0;
    }

    .divider {
      position: absolute;
      left: 63px;
      top: var(--div-top);
      width: 487px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .divider i {
      height: 1.5px;
      background: var(--divider);
      border: none;
      display: block;
    }

    .divider i:first-child {
      flex: 0 0 var(--or-line-l);
    }

    .divider i:last-child {
      flex: 0 0 var(--or-line-r);
    }

    .divider b {
      flex: 1 1 auto;
      text-align: center;
      font-size: var(--or-fs);
      font-weight: var(--or-fw);
      letter-spacing: var(--or-ls);
      color: var(--or);
      transform: translate(var(--or-dx), var(--or-dy));
    }

    #gBtn {
      position: absolute;
      left: 62px;
      top: 535px;
      width: 489px;
      height: 59.5px;
      border: 1.5px solid var(--gBorder);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--g-gap);
      font-family: inherit;
      font-size: var(--gt-fs);
      font-weight: var(--gt-fw);
      letter-spacing: var(--gt-ls);
      word-spacing: var(--gt-ws);
      color: var(--gtext);
      transition: background 0.18s ease, box-shadow 0.18s ease, transform 0.18s cubic-bezier(0.2, 0.7, 0.3, 1);
    }

    #gBtn:hover {
      background: #fff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.07);
    }

    #gBtn:active {
      transform: translateY(1px);
    }

    .google-svg {
      width: var(--g-icon);
      height: var(--g-icon);
      flex-shrink: 0;
    }

    #gBtn span {
      transform: translateY(var(--gt-dy));
    }

    #bottom {
      position: absolute;
      left: 62px;
      width: 489px;
      top: var(--bt-top);
      text-align: center;
      font-size: var(--bt-fs);
      font-weight: var(--bt-fw);
      letter-spacing: var(--bt-ls);
      word-spacing: var(--bt-ws);
      color: var(--bottom);
    }

    #bottom a {
      color: #000;
      font-weight: var(--bt-fwb);
      text-decoration: underline;
      text-underline-offset: var(--bt-uo);
      text-decoration-thickness: 2px;
    }

    /* Tablet Portrait Mode */
    body.tabport .photo {
      width: 100%;
      height: var(--band-h);
      position: absolute;
      left: 0;
      top: 0;
      overflow: hidden;
    }

    body.tabport .photo-img--tall {
      display: none;
    }

    body.tabport .photo-img--wide {
      display: block;
      object-position: 50% 50%;
    }

    body.tabport .hero {
      position: absolute;
      left: var(--tp-hero-side);
      bottom: var(--tp-hero-b);
      width: auto;
      height: auto;
      transform: none;
      display: flex;
      flex-direction: column;
      gap: var(--tp-hero-gap);
      pointer-events: none;
    }

    body.tabport .badge {
      position: static;
      display: inline-flex;
      width: fit-content;
      transform: scale(var(--badge-k));
      transform-origin: left bottom;
      margin: 0;
    }

    body.tabport .hl-wrap {
      position: static;
      display: block;
      width: var(--hl-wrap-w);
    }

    body.tabport .hl {
      position: static;
      display: inline;
      font-size: var(--tp-hero-fs);
      line-height: var(--tp-hero-lh);
      letter-spacing: calc(var(--hl1-ls) / var(--hl1-fs) * var(--tp-hero-fs));
      white-space: normal;
    }

    body.tabport #hl1::after {
      content: ' ';
    }

    body.tabport .pane {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--band-h);
      bottom: 0;
    }

    body.tabport .card {
      position: absolute;
      left: var(--card-left);
      top: var(--card-top);
      width: var(--card-w);
      height: var(--card-h);
      border-radius: 26px;
    }

    body.tabport .card-in {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: none;
    }

    body.tabport .col {
      position: absolute;
      left: var(--tp-pad);
      width: calc(100% - var(--tp-pad) * 2);
    }

    body.tabport #h1 {
      top: var(--tp-h1-top);
      font-size: var(--tp-h1-fs);
      letter-spacing: calc(var(--h1-ls) / var(--h1-fs) * var(--tp-h1-fs));
    }

    body.tabport #sub {
      top: var(--tp-sub-top);
      font-size: var(--tp-sub-fs);
      letter-spacing: calc(var(--sub-ls) / var(--sub-fs) * var(--tp-sub-fs));
    }

    body.tabport .field {
      position: absolute;
      left: var(--tp-pad);
      width: calc(100% - var(--tp-pad) * 2);
    }

    body.tabport #email {
      top: var(--tp-em-top);
      height: var(--tp-em-h);
      border-radius: var(--tp-em-r);
      padding: 0 var(--tp-eph-pad);
    }

    body.tabport #email input {
      font-size: var(--tp-eph-fs);
      letter-spacing: calc(var(--eph-ls) / var(--eph-fs) * var(--tp-eph-fs));
    }

    body.tabport #pw {
      top: var(--tp-pw-top);
      height: var(--tp-pw-h);
      border-radius: var(--tp-em-r);
      padding: 0 var(--tp-eph-pad);
    }

    body.tabport #pw input {
      font-size: var(--tp-eph-fs);
    }

    body.tabport #loginBtn {
      position: absolute;
      left: var(--tp-pad);
      top: var(--tp-btn-top);
      width: calc(100% - var(--tp-pad) * 2);
      height: var(--tp-btn-h);
      font-size: var(--tp-btn-fs);
      gap: var(--tp-btn-gap);
      padding-left: var(--login-padl);
    }

    body.tabport .arrow-svg {
      width: var(--tp-arrow);
      height: var(--tp-arrow);
    }

    body.tabport .divider {
      position: absolute;
      left: var(--tp-pad);
      top: var(--tp-div-top);
      width: calc(100% - var(--tp-pad) * 2);
    }

    body.tabport .divider i {
      height: var(--tp-div-h);
      flex: 1 1 auto;
    }

    body.tabport .divider b {
      font-size: var(--tp-or-fs);
      padding: 0 var(--tp-or-pad);
      flex: 0 0 auto;
      transform: none;
    }

    body.tabport #gBtn {
      position: absolute;
      left: var(--tp-pad);
      top: var(--tp-g-top);
      width: calc(100% - var(--tp-pad) * 2);
      height: var(--tp-g-h);
      font-size: var(--tp-gt-fs);
      gap: var(--tp-g-gap);
    }

    body.tabport .google-svg {
      width: var(--tp-g-icon);
      height: var(--tp-g-icon);
    }

    body.tabport #bottom {
      position: absolute;
      left: var(--tp-pad);
      top: var(--tp-bt-top);
      width: calc(100% - var(--tp-pad) * 2);
      font-size: var(--tp-bt-fs);
      letter-spacing: calc(var(--bt-ls) / var(--bt-fs) * var(--tp-bt-fs));
    }

    /* Phone / Stacked Mode */
    body.stacked {
      height: auto;
      min-height: 100%;
      overflow-y: auto;
      background: #fff;
    }

    body.stacked .stage {
      position: relative;
      inset: auto;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: visible;
    }

    body.stacked .photo {
      position: relative;
      left: auto;
      top: auto;
      width: 100%;
      height: var(--mobile-hero-h);
      overflow: hidden;
      flex-shrink: 0;
    }

    body.stacked .photo-img--tall {
      display: none;
    }

    body.stacked .photo-img--wide {
      display: block;
      object-position: 64% 48%;
      transform: scale(1.015);
    }

    body.stacked .scrim {
      display: block;
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7,10,13,0.02) 18%, rgba(7,10,13,0.12) 48%, rgba(7,10,13,0.78) 100%);
      pointer-events: none;
    }

    body.stacked .hero {
      position: absolute;
      left: 24px;
      bottom: 42px;
      width: calc(100% - 48px);
      height: auto;
      transform: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
      z-index: 2;
    }

    body.stacked .badge {
      position: static;
      height: 31px;
      padding: 0 12px;
      background: rgba(24, 27, 30, 0.82);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
      font-size: 11px;
      display: inline-flex;
      width: fit-content;
      transform: none;
      border-radius: 999px;
    }

    body.stacked .badge-icon {
      width: 14px;
      height: 13.4px;
    }

    body.stacked .hl-wrap {
      position: static;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    body.stacked .hl {
      position: static;
      color: #fff;
      font-size: clamp(30px, 8.8vw, 38px);
      letter-spacing: -0.035em;
      line-height: 0.96;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.32);
      white-space: normal;
      display: block;
    }

    body.stacked .pane {
      position: relative;
      left: auto;
      right: auto;
      top: auto;
      bottom: auto;
      width: 100%;
      flex: 1 1 auto;
      z-index: 3;
    }

    body.stacked .card {
      position: relative;
      left: auto;
      top: auto;
      width: 100%;
      height: auto;
      margin: -28px 0 0;
      border-radius: 28px 28px 0 0;
      background: #fff;
      border: 0;
      box-shadow: 0 -10px 28px rgba(20, 28, 36, 0.10);
      min-height: calc(100svh - var(--mobile-hero-h) + 28px);
      transform: none;
      overflow: visible;
    }

    body.stacked .card-in {
      position: relative;
      inset: auto;
      max-width: 500px;
      width: 100%;
      height: auto;
      margin: 0 auto;
      padding: 36px clamp(24px, 7vw, 38px) max(30px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: center;
      transform: none;
    }

    body.stacked .col,
    body.stacked .field,
    body.stacked #loginBtn,
    body.stacked .divider,
    body.stacked #gBtn,
    body.stacked #bottom {
      position: static;
      width: 100%;
      left: auto;
      top: auto;
      transform: none;
    }

    body.stacked #h1 {
      font-size: clamp(31px, 8.8vw, 38px);
      line-height: 1.15;
      margin: 0 0 10px;
      text-align: center;
    }

    body.stacked #sub {
      font-size: 15px;
      line-height: 1.35;
      margin: 0 0 28px;
      text-align: center;
    }

    body.stacked .field {
      height: 56px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    body.stacked #pw {
      margin-bottom: 24px;
    }

    body.stacked .field input {
      font-size: 16px;
    }

    body.stacked #loginBtn {
      height: 58px;
      font-size: 16px;
      margin-bottom: 24px;
      padding-left: 0;
    }

    body.stacked .divider {
      margin-bottom: 24px;
    }

    body.stacked .divider i {
      height: 1.5px;
      flex: 1 1 auto;
    }

    body.stacked .divider b {
      font-size: 11.5px;
      padding: 0 16px;
      flex: 0 0 auto;
      transform: none;
    }

    body.stacked #gBtn {
      height: 56px;
      font-size: 16px;
      margin-bottom: 28px;
    }

    body.stacked #bottom {
      font-size: 14px;
      text-align: center;
      margin: 0;
    }

    @media (max-width: 370px) {
      :root {
        --mobile-hero-h: 232px;
      }
      body.stacked .card-in {
        padding: 28px 18px max(24px, env(safe-area-inset-bottom));
      }
      body.stacked .hl {
        font-size: 30px;
      }
    }

    @media (max-height: 520px) and (orientation: landscape) {
      :root {
        --mobile-hero-h: 208px;
      }
      body.stacked .card-in {
        justify-content: flex-start;
      }
    }

    /* Entrance Animation Pre-paint guard states */
    .entry-pending .card,
    .entry-pending .badge,
    .entry-pending #hl1,
    .entry-pending #hl2,
    .entry-pending #h1,
    .entry-pending #sub,
    .entry-pending #email,
    .entry-pending #pw,
    .entry-pending #loginBtn,
    .entry-pending .divider,
    .entry-pending #gBtn,
    .entry-pending #bottom {
      opacity: 0;
      will-change: transform, opacity, clip-path;
    }

    .entry-pending .card {
      transform: translateY(12px) scale(0.988);
    }

    .entry-pending .badge {
      transform: translateY(8px);
    }

    .entry-pending #hl1,
    .entry-pending #hl2 {
      transform: translateY(16px);
      clip-path: inset(100% 0 0 0);
    }

    .entry-pending #h1,
    .entry-pending #sub {
      transform: translateY(10px);
    }

    .entry-pending #email,
    .entry-pending #pw,
    .entry-pending #loginBtn {
      transform: translateY(8px);
    }

    .entry-pending .divider {
      transform: translateY(6px);
    }

    .entry-pending #gBtn {
      transform: translateY(8px);
    }

    .entry-pending #bottom {
      transform: translateY(6px);
    }

    @media (max-width: 699px) {
      .entry-pending .card {
        transform: translateY(14px);
      }
      .entry-pending #hl1,
      .entry-pending #hl2 {
        transform: translateY(12px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
      .entry-pending .card,
      .entry-pending .badge,
      .entry-pending #hl1,
      .entry-pending #hl2,
      .entry-pending #h1,
      .entry-pending #sub,
      .entry-pending #email,
      .entry-pending #pw,
      .entry-pending #loginBtn,
      .entry-pending .divider,
      .entry-pending #gBtn,
      .entry-pending #bottom {
        opacity: 1 !important;
        transform: none !important;
        clip-path: none !important;
        will-change: auto !important;
      }
    }
  </style>

              <path d="M3 11h15.4M11 3.3l7.7 7.7-7.7 7.7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="divider">
            <i></i><b>OR</b><i></i>
          </div>
          <button type="button" id="gBtn">
            <svg class="google-svg" viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span>Sign in with Google</span>
          </button>
          <p id="bottom">Don&#8217;t have an account? <a href="#start-free">Start Free</a></p>
        </div>
      </div>
    </section>
  </div>

  <script>
    /* Responsive engine (JS-driven, three modes) */
    (function () {
      var REF_W = 1464, REF_H = 949, PHOTO_W = 836, PANE_W = 628, CARD_W = 613, CARD_H = 922;
      var CONTENT_H = 697;
      var IMG_W = 1177, IMG_H = 1336, IMG_REF_SCALE = 836 / 1177;
      var PANE_RATIO = PANE_W / REF_W;
      var HERO_W = 681, HERO_H = 219;
      var REF_CARD_ASPECT = 692 / 855;
      var RAMP_HI = 1280, RAMP_LO = 1000, PHOTO_MIN = 0.42;
      var RAMP_LO2 = 820, PHOTO_MIN2 = 0.36;
      var TP = {
        "pad": 0.1076,
        "h1Top": 0.08656,
        "h1Fs": 0.06839,
        "subTop": 0.17368,
        "subFs": 0.0309,
        "emTop": 0.25435,
        "emH": 0.10257,
        "emR": 0.0202,
        "ephFs": 0.02702,
        "ephPad": 0.0332,
        "pwTop": 0.36851,
        "pwH": 0.10839,
        "btnTop": 0.50435,
        "btnH": 0.10981,
        "btnFs": 0.0275,
        "arrow": 0.026,
        "btnGap": 0.02,
        "divTop": 0.68222,
        "orFs": 0.02245,
        "orPad": 0.051,
        "divH": 0.0026,
        "gTop": 0.76445,
        "gH": 0.09966,
        "gIcon": 0.032,
        "gtFs": 0.03205,
        "gGap": 0.026,
        "btTop": 0.89668,
        "btFs": 0.02876,
        "heroFs": 0.1058,
        "badgeH": 0.0742,
        "heroLh": 1.1246,
        "heroBot": 0.06493,
        "heroGap": -0.30423,
        "heroSide": 0.0525
      };

      var mqLandscape = window.matchMedia('(min-width:700px) and (min-aspect-ratio:51/50)');
      var mqPortrait  = window.matchMedia('(min-width:700px) and (max-aspect-ratio:51/50)');

      var photo = document.querySelector('.photo');
      var pane = document.querySelector('.pane');
      var card = document.getElementById('card');
      var cardIn = document.getElementById('cardIn');
      var hero = document.getElementById('hero');
      var hlWrap = document.querySelector('.hl-wrap');

      var currentMode = '';

      function clearInline() {
        if (photo) photo.style.cssText = '';
        if (pane) pane.style.cssText = '';
        if (card) card.style.cssText = '';
        if (cardIn) cardIn.style.cssText = '';
        if (hero) hero.style.cssText = '';
        if (hlWrap) hlWrap.style.cssText = '';
      }

      function setMode(mode) {
        if (currentMode !== mode) {
          clearInline();
          document.body.classList.remove('land', 'tabport', 'stacked');
          if (mode === 'land') document.body.classList.add('land');
          else if (mode === 'tabport') document.body.classList.add('tabport');
          else if (mode === 'phone') document.body.classList.add('stacked');
          currentMode = mode;
        }
      }

      function photoRatio(vw) {
        if (vw >= RAMP_HI) {
          return 1 - PANE_RATIO;
        } else if (vw >= RAMP_LO) {
          var t = (vw - RAMP_LO) / (RAMP_HI - RAMP_LO);
          return PHOTO_MIN + t * ((1 - PANE_RATIO) - PHOTO_MIN);
        } else if (vw >= RAMP_LO2) {
          var t2 = (vw - RAMP_LO2) / (RAMP_LO - RAMP_LO2);
          return PHOTO_MIN2 + t2 * (PHOTO_MIN - PHOTO_MIN2);
        } else {
          return PHOTO_MIN2;
        }
      }

      function headlineMeasure() {
        var s = document.createElement('span');
        var heroFs = document.documentElement.style.getPropertyValue('--tp-hero-fs') || '56px';
        s.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font-family:Eloquia,sans-serif;font-variation-settings:"wght" 578;font-size:' + heroFs + ';letter-spacing:calc(var(--hl1-ls)/var(--hl1-fs)*' + heroFs + ');';
        s.textContent = 'Find Signal to Action Instantly';
        document.body.appendChild(s);
        var w = s.getBoundingClientRect().width;
        document.body.removeChild(s);
        return w;
      }

      function layout() {
        var vw = window.innerWidth;
        var vh = window.innerHeight;

        if (vw < 700) {
          setMode('phone');
          return;
        }

        if (mqLandscape.matches) {
          setMode('land');
          var pr = photoRatio(vw);
          var pw = Math.round(vw * pr);
          var paneW = vw - pw;

          photo.style.width = pw + 'px';
          photo.style.left = '0px';
          pane.style.left = pw + 'px';
          pane.style.width = paneW + 'px';

          // placeCard
          var cs = Math.min(paneW / PANE_W, vh / CONTENT_H);
          var gapL = 1 * cs;
          var mT = 14 * cs;
          var mB = 13 * cs;
          var mR = 14 * cs;
          var cw = Math.max(CARD_W * cs, paneW - gapL - mR);
          var ch = vh - mT - mB;
          var r = 26 * cs;
          var bw = Math.max(1, cs);

          card.style.left = gapL + 'px';
          card.style.top = mT + 'px';
          card.style.width = cw + 'px';
          card.style.height = ch + 'px';
          card.style.borderRadius = r + 'px';
          card.style.border = bw + 'px solid rgba(0,0,0,.036)';

          cardIn.style.transform = 'translate(' + ((cw - CARD_W * cs) / 2) + 'px,0) scale(' + cs + ')';

          // seatHero
          var bandH = vh;
          var imgScale = Math.max(pw / IMG_W, bandH / IMG_H);
          var s = Math.min(imgScale / IMG_REF_SCALE, (pw * 0.92) / HERO_W);
          hero.style.transformOrigin = 'left bottom';
          hero.style.transform = 'scale(' + s + ')';
          hero.style.bottom = '0px';
          hero.style.left = '0px';
        } else {
          // tabport
          setMode('tabport');
          var band = Math.round(vh * 0.425);
          var sideMargin = Math.round(vw * 0.0525);
          var footer = Math.round(vh * 0.0297);

          var cardW = vw - sideMargin * 2;
          var cardH = vh - band - footer;
          var S = Math.min(cardH, cardW * REF_CARD_ASPECT);

          var root = document.documentElement;
          root.style.setProperty('--band-h', band + 'px');
          root.style.setProperty('--card-left', sideMargin + 'px');
          root.style.setProperty('--card-top', '0px');
          root.style.setProperty('--card-w', cardW + 'px');
          root.style.setProperty('--card-h', cardH + 'px');

          // Hero vars
          root.style.setProperty('--tp-hero-b', (band * TP.heroBot) + 'px');
          root.style.setProperty('--tp-hero-gap', (band * TP.heroGap) + 'px');
          root.style.setProperty('--tp-hero-side', (vw * TP.heroSide) + 'px');
          root.style.setProperty('--badge-k', String(band * TP.badgeH / 37));
          root.style.setProperty('--tp-hero-fs', (band * TP.heroFs) + 'px');
          root.style.setProperty('--tp-hero-lh', String(TP.heroLh));

          // Card vars
          root.style.setProperty('--tp-pad', (cardW * TP.pad) + 'px');
          root.style.setProperty('--tp-or-pad', (cardW * TP.orPad) + 'px');

          root.style.setProperty('--tp-h1-top', (cardH * TP.h1Top) + 'px');
          root.style.setProperty('--tp-sub-top', (cardH * TP.subTop) + 'px');
          root.style.setProperty('--tp-em-top', (cardH * TP.emTop) + 'px');
          root.style.setProperty('--tp-em-h', (cardH * TP.emH) + 'px');
          root.style.setProperty('--tp-pw-top', (cardH * TP.pwTop) + 'px');
          root.style.setProperty('--tp-pw-h', (cardH * TP.pwH) + 'px');
          root.style.setProperty('--tp-btn-top', (cardH * TP.btnTop) + 'px');
          root.style.setProperty('--tp-btn-h', (cardH * TP.btnH) + 'px');
          root.style.setProperty('--tp-div-top', (cardH * TP.divTop) + 'px');
          root.style.setProperty('--tp-div-h', (cardH * TP.divH) + 'px');
          root.style.setProperty('--tp-g-top', (cardH * TP.gTop) + 'px');
          root.style.setProperty('--tp-g-h', (cardH * TP.gH) + 'px');
          root.style.setProperty('--tp-bt-top', (cardH * TP.btTop) + 'px');

          root.style.setProperty('--tp-h1-fs', (S * TP.h1Fs) + 'px');
          root.style.setProperty('--tp-sub-fs', (S * TP.subFs) + 'px');
          root.style.setProperty('--tp-em-r', (S * TP.emR) + 'px');
          root.style.setProperty('--tp-eph-fs', (S * TP.ephFs) + 'px');
          root.style.setProperty('--tp-eph-pad', (S * TP.ephPad) + 'px');
          root.style.setProperty('--tp-btn-fs', (S * TP.btnFs) + 'px');
          root.style.setProperty('--tp-arrow', (S * TP.arrow) + 'px');
          root.style.setProperty('--tp-btn-gap', (S * TP.btnGap) + 'px');
          root.style.setProperty('--tp-or-fs', (S * TP.orFs) + 'px');
          root.style.setProperty('--tp-g-icon', (S * TP.gIcon) + 'px');
          root.style.setProperty('--tp-gt-fs', (S * TP.gtFs) + 'px');
          root.style.setProperty('--tp-g-gap', (S * TP.gGap) + 'px');
          root.style.setProperty('--tp-bt-fs', (S * TP.btFs) + 'px');

          var hw = Math.round(headlineMeasure() * 0.61);
          root.style.setProperty('--hl-wrap-w', hw + 'px');
        }
      }

      window.addEventListener('resize', layout, { passive: true });
      window.addEventListener('orientationchange', layout, { passive: true });
      if (mqLandscape.addEventListener) {
        mqLandscape.addEventListener('change', layout);
        mqPortrait.addEventListener('change', layout);
      } else if (mqLandscape.addListener) {
        mqLandscape.addListener(layout);
        mqPortrait.addListener(layout);
      }
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(layout);
      }
      layout();
    })();

    /* Entrance animation (runs exactly once) */
    (function () {
      var hasRunEntrance = false;

      function releaseEntrance() {
        if (window.__entryFallback) {
          clearTimeout(window.__entryFallback);
          window.__entryFallback = null;
        }
        document.documentElement.classList.remove('entry-pending');
      }

      function runEntrance() {
        if (hasRunEntrance) return;
        hasRunEntrance = true;

        var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (prefersReduced || !Element.prototype.animate) {
          releaseEntrance();
          return;
        }

        var ease = 'cubic-bezier(.16,1,.3,1)';
        var softEase = 'cubic-bezier(.22,1,.36,1)';
        var compact = window.matchMedia('(max-width:699px)').matches;

        var steps = [
          {
            el: document.querySelector('.card'),
            delay: 40,
            dur: 820,
            easing: ease,
            from: {
              opacity: 0,
              transform: compact ? 'translateY(14px)' : 'translateY(12px) scale(.988)'
            }
          },
          {
            el: document.querySelector('.badge'),
            delay: 120,
            dur: 480,
            easing: softEase,
            from: {
              opacity: 0,
              transform: 'translateY(8px)'
            }
          },
          {
            el: document.getElementById('hl1'),
            delay: 240,
            dur: 760,
            easing: ease,
            from: {
              opacity: 0,
              transform: compact ? 'translateY(12px)' : 'translateY(16px)',
              clipPath: 'inset(100% 0 0 0)'
            },
            toClip: 'inset(0 0 0 0)'
          },
          {
            el: document.getElementById('hl2'),
            delay: 330,
            dur: 760,
            easing: ease,
            from: {
              opacity: 0,
              transform: compact ? 'translateY(12px)' : 'translateY(16px)',
              clipPath: 'inset(100% 0 0 0)'
            },
            toClip: 'inset(0 0 0 0)'
          },
          {
            el: document.getElementById('h1'),
            delay: 470,
            dur: 620,
            easing: ease,
            from: {
              opacity: 0,
              transform: 'translateY(10px)'
            }
          },
          {
            el: document.getElementById('sub'),
            delay: 570,
            dur: 560,
            easing: ease,
            from: {
              opacity: 0,
              transform: 'translateY(10px)'
            }
          },
          {
            el: document.getElementById('email'),
            delay: 720,
            dur: 520,
            easing: softEase,
            from: {
              opacity: 0,
              transform: 'translateY(8px)'
            }
          },
          {
            el: document.getElementById('pw'),
            delay: 790,
            dur: 520,
            easing: softEase,
            from: {
              opacity: 0,
              transform: 'translateY(8px)'
            }
          },
          {
            el: document.getElementById('loginBtn'),
            delay: 930,
            dur: 560,
            easing: ease,
            from: {
              opacity: 0,
              transform: 'translateY(8px)'
            }
          },
          {
            el: document.querySelector('.divider'),
            delay: 1060,
            dur: 440,
            easing: softEase,
            from: {
              opacity: 0,
              transform: 'translateY(6px)'
            }
          },
          {
            el: document.getElementById('gBtn'),
            delay: 1150,
            dur: 540,
            easing: ease,
            from: {
              opacity: 0,
              transform: 'translateY(8px)'
            }
          },
          {
            el: document.getElementById('bottom'),
            delay: 1260,
            dur: 500,
            easing: softEase,
            from: {
              opacity: 0,
              transform: 'translateY(6px)'
            }
          }
        ];

        var animations = [];

        steps.forEach(function (step) {
          if (!step.el) return;
          var keyframes = [
            step.from,
            {
              opacity: 1,
              transform: 'none',
              clipPath: step.toClip || 'none'
            }
          ];
          try {
            var anim = step.el.animate(keyframes, {
              delay: step.delay,
              duration: step.dur,
              easing: step.easing,
              fill: 'both'
            });
            animations.push(anim);
          } catch (e) {}
        });

        document.documentElement.classList.remove('entry-pending');

        var finishPromises = animations.map(function (a) {
          return a.finished;
        });

        Promise.allSettled(finishPromises).then(function () {
          animations.forEach(function (a) {
            try { a.cancel(); } catch (e) {}
          });
          animations.length = 0;
          releaseEntrance();
        });
      }

      var fontWait = (document.fonts && document.fonts.ready)
        ? document.fonts.ready
        : Promise.resolve();
      var timerWait = new Promise(function (r) { setTimeout(r, 650); });

      Promise.race([fontWait, timerWait]).then(function () {
        requestAnimationFrame(function () {
          requestAnimationFrame(runEntrance);
        });
      });
    })();
  </script>
</body>
</html>
